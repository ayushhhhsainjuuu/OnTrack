apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduling-service
  labels:
    app: scheduling-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: scheduling-service
  template:
    metadata:
      labels:
        app: scheduling-service
    spec:
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: scheduling-service
          image: ontrackacr.azurecr.io/scheduling-service:v1
          ports:
            - containerPort: 4001
          env:
            - name: PORT
              value: "4001"
            - name: SUPABASE_URL
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: SUPABASE_URL
            - name: SUPABASE_SERVICE_ROLE_KEY
              valueFrom:
                secretKeyRef:
                  name: supabase-secrets
                  key: SUPABASE_SERVICE_ROLE_KEY
          readinessProbe:
            httpGet:
              path: /health
              port: 4001
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: scheduling-service
spec:
  selector:
    app: scheduling-service
  ports:
    - protocol: TCP
      port: 80
      targetPort: 4001
  type: LoadBalancer