name: Deploy Leave Service

on:
  push:
    branches: [main]
    paths: ['backend/leave-service/**']
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-backend-service.yml
    with:
      service_name: leave-service
      service_dir: backend/leave-service
      azure_app_name: ontrack-leave-service
      port: "4003"
    secrets:
      ACR_LOGIN_SERVER: ${{ secrets.ACR_LOGIN_SERVER }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      PUBLISH_PROFILE: ${{ secrets.AZURE_LEAVE_SERVICE_PUBLISH_PROFILE }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
